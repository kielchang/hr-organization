name: CI

# 每次 push 或 PR 時跑 lint、型別檢查與測試。
# 部署 workflow 為求速度跳過型別檢查，由此 workflow 補上完整把關。
on:
  push:
    branches-ignore:
      - gh-pages
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # lint 目前有既存的 react-hooks 告警待清理，先不阻擋 CI（追蹤中）。
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Type check
        run: npx tsc -b

      - name: Test
        run: npm run test
