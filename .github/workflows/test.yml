name: CI

# 每次 push 或 PR 時跑 lint、型別檢查與測試。
# 部署 workflow 為求速度跳過型別檢查，由此 workflow 補上完整把關。
on:
  push:
    branches-ignore:
      - gh-pages
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc -b

      - name: Test (with coverage thresholds)
        run: npm run test:cov

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgresql://hr:hr@localhost:5432/hr_org
      TEST_DATABASE_URL: postgresql://hr:hr@localhost:5432/hr_org
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 以 step 啟動 Postgres（取代 services:），對 registry 拉取超時加上重試，
      # 避免 Docker Hub 暫時性逾時讓整合測試 job 失敗。
      - name: Start PostgreSQL (with pull retry)
        run: |
          for i in 1 2 3 4 5; do
            docker pull postgres:16-alpine && break || { echo "pull retry $i"; sleep 10; }
          done
          docker run -d --name pg \
            -e POSTGRES_USER=hr -e POSTGRES_PASSWORD=hr -e POSTGRES_DB=hr_org \
            -p 5432:5432 postgres:16-alpine
          echo "waiting for postgres..."
          for i in $(seq 1 30); do
            docker exec pg pg_isready -U hr -d hr_org && exit 0
            sleep 2
          done
          echo "postgres did not become ready" >&2 && exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Verify (type check + test, incl. Postgres integration)
        run: npm run verify
